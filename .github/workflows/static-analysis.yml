name: Static Analysis

on:
  workflow_call:
  workflow_dispatch:
  # CodeQL tambem pega CVEs novas em codigo que nao mudou.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Analisar
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin

  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # failOnError=false no pom: os achados viram alertas no Security tab,
      # nao bloqueiam o merge. Ver .github/README.md para como endurecer depois.
      - name: Rodar SpotBugs
        run: mvn -B --no-transfer-progress -DskipTests compile spotbugs:spotbugs

      # O SpotBugs emite URIs relativas ao source root (br/com/fiap/...).
      # O code scanning precisa de caminhos relativos ao repositorio para
      # conseguir ligar o alerta ao arquivo e a linha.
      - name: Normalizar caminhos do SARIF
        run: |
          python3 - <<'PY'
          import json, os
          p = 'target/spotbugsSarif.json'
          if not os.path.exists(p):
              raise SystemExit('SARIF nao gerado')
          d = json.load(open(p))
          n = 0
          for run in d.get('runs', []):
              for res in run.get('results', []):
                  for loc in res.get('locations', []):
                      a = loc.get('physicalLocation', {}).get('artifactLocation')
                      if a and 'uri' in a and not a['uri'].startswith('src/'):
                          a['uri'] = 'src/main/java/' + a['uri']
                          n += 1
          json.dump(d, open(p, 'w'))
          print(f'{n} caminhos normalizados')
          PY

      - name: Enviar SARIF para o code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/spotbugsSarif.json
          category: spotbugs

      - name: Montar resumo dos achados
        if: always()
        run: |
          python3 .github/scripts/spotbugs_comment.py \
            --sarif target/spotbugsSarif.json \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ github.event.pull_request.number || '' }}" \
            > spotbugs-comment.md
          cat spotbugs-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar no PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/sticky_comment.sh static-analysis spotbugs-comment.md

      - name: Guardar relatorio do SpotBugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: |
            target/spotbugsSarif.json
            target/spotbugsXml.xml
          retention-days: 7
          if-no-files-found: warn
