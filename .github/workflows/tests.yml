name: Tests

# Reutilizavel: pode ser chamado pelo ci.yml ou executado sozinho
# pela aba Actions -> Tests -> Run workflow.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Testes unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # SanguebomApplicationTests e um @SpringBootTest real: sobe o contexto
    # e roda as migrations do Flyway. Precisa de um Postgres de verdade.
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: sanguebom
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: sanguebom
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # spring-boot-docker-compose esta no classpath e o docker-compose.yml
      # fica na raiz; sem isso o @SpringBootTest tentaria subir o compose.
      SPRING_DOCKER_COMPOSE_ENABLED: false

    steps:
      - uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # O repo nao versiona o Maven Wrapper (.gitignore ignora mvnw/.mvn),
      # entao usamos o mvn do runner.
      - name: mvn verify
        run: mvn -B --no-transfer-progress verify

      - name: Publicar resultado dos testes
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: Resultado dos testes
          detailed_summary: true
          include_passed: false
          # Em PR de fork o token nao tem permissao de checks; nao falhar por isso.
          fail_on_failure: false

      - name: Guardar relatorio JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

      - name: Guardar relatorios do Surefire
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
