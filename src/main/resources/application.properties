spring.application.name=sanguebom

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sanguebom}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true

error.handling.http-status-in-json-response=true
error.handling.exception-logging=NO_LOGGING
error.handling.full-stacktrace-http-statuses=5xx
error.handling.log-levels.5xx=ERROR

spring.docker.compose.lifecycle-management=start-only
springdoc.pathsToMatch=/

# Habilita a execução automática do Flyway na inicialização
spring.flyway.enabled=true

# Aponta o diretório onde os seus arquivos V2026...__nome.sql estão
# (Esse é o valor padrão, mas é uma boa prática deixar explícito)
spring.flyway.locations=classpath:db/migration
# Liga o modo detetive da autoconfiguração do Flyway


# CRÍTICO: Se o seu banco já tiver tabelas ou for a primeira vez rodando em um banco não-vazio,
# isso diz ao Flyway para criar a tabela de controle sem dar erro.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
