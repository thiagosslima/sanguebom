spring.application.name=sanguebom

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sanguebom}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
# A V20260902100000 entrou no repositorio depois que a V20260907120000 ja tinha sido
# aplicada; sem out-of-order o Flyway recusa subir em qualquer banco nesse estado.
spring.flyway.out-of-order=true

#Outros
error.handling.http-status-in-json-response=true
error.handling.exception-logging=NO_LOGGING
error.handling.full-stacktrace-http-statuses=5xx
error.handling.log-levels.5xx=ERROR

spring.docker.compose.lifecycle-management=start-only
# Sem isso o documento OpenAPI fica restrito ao path "/" e o Swagger UI mostra apenas o
# HomeResource, escondendo os 59 endpoints reais e toda a anotacao @Operation/@Schema.
springdoc.pathsToMatch=/,/api/**

# SSE: tempo maximo da conexao aberta e intervalo do ping que a mantem viva
sanguebom.notifications.sse.timeout-ms=1800000
sanguebom.notifications.sse.heartbeat-ms=25000
# Rotina diaria da meta de exames
sanguebom.notifications.exam-goal.cron=0 0 8 * * *
sanguebom.notifications.exam-goal.zone=America/Sao_Paulo
sanguebom.notifications.exam-goal.page-size=200
